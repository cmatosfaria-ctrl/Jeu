<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Alchimie : l'Atelier</title>
  <meta name="description" content="Jeu de réflexion et de stratégie : dosages, tuyauterie et gestion d'un atelier d'alchimiste.">
  <meta name="theme-color" content="#07070d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/orbitron.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/rajdhani-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Définitions SVG partagées par toutes les cases de tuyauterie -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="g-copper" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#4a2410"/><stop offset=".3" stop-color="#e09a62"/><stop offset=".55" stop-color="#b8612c"/><stop offset="1" stop-color="#3d1d0c"/>
      </linearGradient>
      <linearGradient id="g-brass" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#6b4c18"/><stop offset=".35" stop-color="#ffe39b"/><stop offset=".6" stop-color="#c79a45"/><stop offset="1" stop-color="#5a3f12"/>
      </linearGradient>
      <radialGradient id="g-brass-r" cx=".35" cy=".3" r=".8">
        <stop offset="0" stop-color="#ffe39b"/><stop offset=".5" stop-color="#c79a45"/><stop offset="1" stop-color="#5a3f12"/>
      </radialGradient>
      <radialGradient id="g-steel-r" cx=".4" cy=".35" r=".8">
        <stop offset="0" stop-color="#4b4862"/><stop offset="1" stop-color="#121119"/>
      </radialGradient>
      <pattern id="g-hazard" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="14" height="14" fill="#14131c"/><rect width="7" height="14" fill="#ffb52e"/>
      </pattern>
      <filter id="f-glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
  </svg>
  <main id="app"></main>
  <noscript>Ce jeu nécessite JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
